        `;

        const userPrompt = mode === 'ingredients'
          ? `Cria uma receita de "${selectedCategory}" para Bimby ${selectedBimbyModel}. O utilizador tem e EXIGE que sejam incluídos todos estes ingredientes: "${ingredientsText}". Tempo limite: ${cookingTime} min. Porções: ${servingsCount}. TENTATIVA #${nextAttempt}. RECEITA A EVITAR (já sugerida antes): "${lastRecipeTitle}". OBRIGATÓRIO: Todos os ingredientes indicados devem figurar na lista "ingredients" e devem ser explicitamente usados nos passos "steps"! Apresenta uma variação culinária distinta e de alta cozinha!`
          : `Adapta esta receita para Bimby ${selectedBimbyModel}. Categoria: "${selectedCategory}". Texto: "${recipeToAdaptText}". Variação #${nextAttempt}. RECEITA ANTERIOR A EVITAR: "${lastRecipeTitle}". OBRIGATÓRIO: Todos os ingredientes presentes no texto original devem constar na lista "ingredients" e ser usados no passo a passo da Bimby!`;

        try {
          if (!settings.apiKey) {
            throw new Error("Modo local de contingência ativo");
          }
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${settings.apiKey}`;
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] },
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (!response.ok) throw new Error('Erro na API');
          const result = await response.json();
          const rawJsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;

          if (rawJsonText) {
            const parsedRecipe = JSON.parse(rawJsonText);
            parsedRecipe.id = 'gen-' + Date.now();
            setGeneratedRecipe(parsedRecipe);
          } else {
            throw new Error('Formato inválido');
          }
        } catch (err) {
          // Motor de rotação local inteligente e rico em técnicas culinárias
          const fallbackRecipe = generateDynamicFallbackRecipe(mode, ingredientsText, recipeToAdaptText, selectedCategory, selectedBimbyModel, nextAttempt);
          setGeneratedRecipe(fallbackRecipe);
        } finally {
          setIsGenerating(false);
        }
      };

      const generateDynamicFallbackRecipe = (m, ingText, adaptText, cat, model, attempt) => {
        // TM5, TM6 e TM7 dispõem de 120°C, copo de 2.2L e inversão digital de lâmina (na TM31 o limite de refogado é 100°C)
        const isTM7 = model !== 'TM31';
        const categoryVariations = CULINARY_VARIATIONS[cat] || CULINARY_VARIATIONS['pratos'];
        
        // Seleciona uma variação diferente a cada tentativa em ciclo rotativo
        const variationIndex = (attempt - 1) % categoryVariations.length;
        const chosenVariation = categoryVariations[variationIndex];

        // Extrai minuciosamente TODOS os ingredientes digitados pelo utilizador
        let userIngredients = [];
        if (m === 'ingredients' && ingText.trim()) {
          userIngredients = ingText
            .replace(/\be\b/gi, ',')
            .split(/[,;\n]+/)
            .map(i => i.trim())
            .filter(i => i.length > 0);
        } else if (m === 'adapt' && adaptText.trim()) {
          userIngredients = adaptText
            .replace(/\be\b/gi, ',')
            .split(/[,;\n]+/)
            .map(i => i.trim().replace(/^[-*•\d.]+\s*/, ''))
            .filter(i => i.length > 2);
        }

        // Dicionário exaustivo de regex para deteção infalível de proteínas e acompanhamentos
        const fishRegex = /\b(peixe|salm[aã]o|pescada|bacalhau|robalo|dourada|atum|marisco|camar[aã]o|polvo|lula[s]?|choco|truta|sardinha[s]?|garoupa|corvina|linguado|bife[s]?\s+de\s+atum|filete[s]?|posta[s]?)\b/i;
        const meatRegex = /\b(carne|frango|vaca|porco|peru|vitela|lombo|bife[s]?|costeleta[s]?|picada|entrecosto|coelho|iscas|alheira|chouri[çc]o|bacon|fiambre|perna|peito[s]?|coxa[s]?|hamb[uú]rguer|presunto|salsicha[s]?)\b/i;
        const vegAccompRegex = /\b(batata[s]?|cenoura[s]?|br[oó]colo[s]?|couve|ervilha[s]?|cogumelo[s]?|feij[aã]o|ab[oó]bora|espinafre[s]?|curgete|abobrinha|arroz|massa|grao|gr[aã]o)\b/i;

        const detectedFish = userIngredients.filter(i => fishRegex.test(i));
        const detectedMeat = userIngredients.filter(i => meatRegex.test(i));
        const detectedAccompaniments = userIngredients.filter(i => vegAccompRegex.test(i));

        const isFishDish = detectedFish.length > 0;
        const isMeatDish = detectedMeat.length > 0;
        const hasProtein = isFishDish || isMeatDish;

        // Limpeza dos nomes dos ingredientes para interpolação natural no texto
        const cleanName = (str) => str.replace(/^(\d+[\s\wº%.-]*\s+(de\s+)?)?/i, '').replace(/^[^\wáàãâéêíóôõúç]+/i, '').trim();

        // Filtro de coerência gastronómica: proíbe misturar hidratos incompatíveis
        const isRiceDish = chosenVariation.style.includes('risotto');
        const isPastaDish = chosenVariation.style.includes('massa') || chosenVariation.style.includes('pesto');

        const culinaryCompatible = userIngredients.filter(ing => {
          const l = ing.toLowerCase();
          if (isRiceDish && (l.includes('massa') || l.includes('esparguete') || l.includes('macarrão') || l.includes('penne') || l.includes('tagliatelle'))) return false;
          if (isPastaDish && l.includes('arroz')) return false;
          return true;
        });

        // Seleção primordial da proteína ou ingrediente de destaque
        let primaryIngredient = '';
        let primaryRaw = '';

        if (isFishDish) {
          primaryRaw = detectedFish[0];
          primaryIngredient = cleanName(primaryRaw);
        } else if (isMeatDish) {
          primaryRaw = detectedMeat[0];
          primaryIngredient = cleanName(primaryRaw);
        } else {
          primaryRaw = culinaryCompatible[0] || (cat === 'sopas' ? 'Legumes da Época' : cat === 'sobremesas' ? 'Chocolate e Fruta' : 'Frango do Campo');
          primaryIngredient = cleanName(primaryRaw);
        }

        // Seleção do acompanhamento secundário
        const rawSecondary = detectedAccompaniments[0] || culinaryCompatible.find(i => cleanName(i).toLowerCase() !== primaryIngredient.toLowerCase()) || (cat === 'sopas' ? 'Batata Doce' : cat === 'sobremesas' ? 'Frutos Silvestres' : 'Legumes Frescos');
        const secondaryIngredient = cleanName(rawSecondary);

        // Nomes formatados dos acompanhamentos
        const accompListClean = detectedAccompaniments.map(cleanName).filter(n => n.toLowerCase() !== primaryIngredient.toLowerCase());
        const accompNames = accompListClean.length > 0 ? accompListClean.join(' e ') : (secondaryIngredient && secondaryIngredient.toLowerCase() !== primaryIngredient.toLowerCase() ? secondaryIngredient : 'os legumes de acompanhamento');

        // Construção da lista de ingredientes completa sem perder rigor nem cortar as proteínas
        let completeIngredientsList = [];
        if (userIngredients.length > 0) {
          completeIngredientsList = userIngredients.map(item => {
            const raw = item.trim();
            // Se o utilizador já forneceu a quantidade, manter tal como está
            if (/^\d/.test(raw)) return raw;
            const l = raw.toLowerCase();

            // 1. PRIORIDADE MÁXIMA: Proteínas avaliadas primeiro
            if (fishRegex.test(l)) return `500g de ${cleanName(raw)} limpo e preparado`;
            if (meatRegex.test(l)) return `500g de ${cleanName(raw)} cortado em pedaços regulares`;

            // 2. Acompanhamentos principais
            if (vegAccompRegex.test(l)) return `350g de ${cleanName(raw)} em cubos médios`;

            // 3. Condimentos com fronteira de palavra estrita \b (evita que 'salmão' case com 'sal' ou 'alheira' com 'alho')
            if (/\b(azeite|óleo|oleo)\b/i.test(l)) return '50g azeite extra virgem';
            if (/\b(sal)\b/i.test(l)) return 'Sal marinho q.b.';
            if (/\b(pimenta)\b/i.test(l)) return 'Pimenta moída q.b.';
            if (/\b(água|agua)\b/i.test(l)) return '750g água mineral';
            if (/\b(alho)\b/i.test(l) && !meatRegex.test(l)) return '2 dentes de alho';
            if (/\b(cebola)\b/i.test(l)) return '1 cebola média';

            return `300g de ${cleanName(raw)}`;
          });

          // Garantir elementos de base para funcionamento na Bimby se ausentes
          if (!completeIngredientsList.some(i => /\b(azeite|manteiga|óleo|oleo)\b/i.test(i))) {
            completeIngredientsList.push('40g azeite extra virgem');
          }
          if (!completeIngredientsList.some(i => /\b(cebola|alho)\b/i.test(i))) {
            completeIngredientsList.push('1 cebola média e 2 dentes de alho');
          }
          if (!completeIngredientsList.some(i => /\b(sal)\b/i.test(i))) {
            completeIngredientsList.push('Sal marinho e pimenta q.b.');
          }

          if (cat === 'pratos' || cat === 'tapas' || cat === 'italiana') {
            if (!completeIngredientsList.some(i => /\b(vinho|caldo|tomate)\b/i.test(i))) {
              completeIngredientsList.push('100g vinho branco seco ou caldo aromático');
            }
          }
        } else {
          completeIngredientsList = [
            '500g de frango ou lombos de peixe fresco',
            '350g de batatas em cubos',
            '1 cebola média e 2 dentes de alho',
            '40g azeite extra virgem',
            '1 folha de louro',
            '100g vinho branco',
            'Sal marinho e ervas frescas a gosto'
          ];
        }

        // Construção culinária especializada para proteínas
        let recipeTitle = '';
        let steps = [];

        if (isFishDish) {
          // Cozedura técnica garantida para peixes
          if (attempt % 2 === 1) {
            recipeTitle = `Lombos de ${primaryIngredient} a Vapor na Varoma com ${accompNames} e Molho Aromático`;
            steps = [
              { step: 1, action: 'Coloque a cebola, dentes de alho e azeite no copo.', min: '5 seg', temp: '-', speed: 'Velocidade 5', notes: 'Pique a base do refogado aromático.' },
              { step: 2, action: 'Refogue com o copo de medida.', min: '5 min', temp: isTM7 ? '120°C' : '100°C', speed: 'Velocidade 1', notes: 'Dourado uniforme.' },
              { step: 3, action: `Disponha ${primaryIngredient} temperado com sal no tabuleiro da Varoma e ${accompNames} no recipiente Varoma. Adicione 500g de água/caldo no copo, coloque a Varoma e cozinhe.`, min: '20 min', temp: 'Varoma', speed: 'Velocidade 1', notes: 'Cozedura a vapor integral sem desfazer o peixe.' },
              { step: 4, action: `Retire a Varoma. Triture o molho do copo com ervas frescas e azeite, regando ${primaryIngredient} e ${accompNames} ao servir.`, min: '30 seg', temp: '-', speed: 'Velocidade 5', notes: 'Prato suculento de chef no ponto ideal.' }
            ];
          } else {
            recipeTitle = `Caldeirada Rica de ${primaryIngredient} com ${accompNames} na Bimby`;
            steps = [
              { step: 1, action: 'Pique a cebola, alho e azeite no copo.', min: '5 seg', temp: '-', speed: 'Velocidade 5', notes: 'Base da caldeirada.' },
              { step: 2, action: 'Refogue os temperos com o copo de medida.', min: '5 min', temp: isTM7 ? '120°C' : '100°C', speed: 'Velocidade 1', notes: 'Libertação de aromas.' },
              { step: 3, action: `Junte ${accompNames}, louro, vinho branco e 200g de caldo. Cozinhe os legumes com lâmina inversa.`, min: '14 min', temp: '100°C', speed: isTM7 ? 'Colher Inversa' : 'Velocidade Colher / Inversa', notes: 'Cozimento dos acompanhamentos mais firmes.' },
              { step: 4, action: `Adicione delicadamente ${primaryIngredient} em pedaços e retifique os temperos. Coza suavemente nos minutos finais.`, min: '6 min', temp: '100°C', speed: isTM7 ? 'Colher Inversa' : 'Velocidade Colher / Inversa', notes: 'As lâminas em rotação inversa preservam o peixe intacto.' }
            ];
          }
        } else if (isMeatDish) {
          // Cozedura técnica garantida para carnes
          if (attempt % 2 === 1) {
            recipeTitle = `Estufado Suculento de ${primaryIngredient} com ${accompNames} e Molho Reduzido`;
            steps = [
              { step: 1, action: 'Pique a cebola, alho e o azeite no copo.', min: '5 seg', temp: '-', speed: 'Velocidade 5', notes: 'Pique finamente a base.' },
              { step: 2, action: 'Refogue para caramelizar suavemente.', min: '5 min', temp: isTM7 ? '120°C' : '100°C', speed: 'Velocidade 1', notes: isTM7 ? 'A 120°C para selagem.' : 'A 100°C na TM31.' },
              { step: 3, action: `Adicione ${primaryIngredient} em cubos, ${accompNames}, louro, sal, pimenta e vinho branco. Cozinhe com rotação inversa ativa.`, min: '22 min', temp: '100°C', speed: isTM7 ? 'Colher Inversa' : 'Velocidade Colher / Inversa', notes: isTM7 ? 'Lâmina inversa digital ativada.' : 'Pressione a inversão de lâminas na TM31.' },
              { step: 4, action: `Verifique a cozedura de ${primaryIngredient} e ${accompNames}. Deixe apurar com o cesto sobre a tampa.`, min: '3 min', temp: 'Varoma', speed: isTM7 ? 'Colher Inversa' : 'Velocidade Colher / Inversa', notes: 'Molho aveludado e carne macia com fibras intactas.' }
            ];
          } else {
            recipeTitle = `Salteado de ${primaryIngredient} com ${accompNames} em Molho de Tomate e Aromáticas`;
            steps = [
              { step: 1, action: 'Coloque a cebola, dentes de alho e azeite no copo.', min: '5 seg', temp: '-', speed: 'Velocidade 5', notes: 'Pique a base aromática.' },
              { step: 2, action: 'Refogue com o copo medidor colocado.', min: '5 min', temp: isTM7 ? '120°C' : '100°C', speed: 'Velocidade 1', notes: 'Aroma tostado.' },
              { step: 3, action: `Adicione ${primaryIngredient} em tiras/cubos, ${accompNames}, vinho e polpa de tomate. Programe a cozedura suave.`, min: '18 min', temp: '100°C', speed: isTM7 ? 'Colher Inversa' : 'Velocidade Colher / Inversa', notes: 'Proteção mecânica das fibras da carne.' },
              { step: 4, action: 'Finalize com ervas frescas picadas e envolva antes de servir quente.', min: '1 min', temp: '-', speed: isTM7 ? 'Colher Inversa' : 'Velocidade Colher / Inversa', notes: 'Empratamento de restaurante.' }
            ];
          }
        } else {
          // Outras categorias ou pratos vegetarianos
          recipeTitle = chosenVariation.titleGen(`${primaryIngredient} e ${secondaryIngredient}`);
          steps = chosenVariation.getSteps(isTM7, primaryIngredient);
        }

        // Auditoria de garantia: assegura que NENHUM ingrediente indicado fica de fora dos passos
        const allStepsText = steps.map(s => s.action.toLowerCase()).join(' ');
        const missingIngredients = completeIngredientsList.filter(ing => {
          const core = cleanName(ing).toLowerCase();
          return core.length > 2 && !allStepsText.includes(core);
        });

        if (missingIngredients.length > 0) {
          const missingNames = missingIngredients.map(cleanName).join(', ');
          const targetIndex = Math.min(2, steps.length - 1);
          steps[targetIndex].action += ` Adicione igualmente ${missingNames}.`;
        }

        return {
          id: 'fb-' + Date.now() + '-' + attempt,
          title: recipeTitle,
          category: cat,
          model: model,
          prepTime: chosenVariation.prepTime || '25 min',
          servings: `${servingsCount} pessoas`,
          difficulty: chosenVariation.difficulty || 'Fácil',
          ingredients: completeIngredientsList,
          steps: steps,
          chefTip: isFishDish
            ? `Dica de Chef: O peixe na Bimby ${model} deve cozinhar sempre na Varoma ou nos minutos finais com a Rotação Inversa para manter as postas tenras e inteiras.`
            : isMeatDish
            ? `Dica de Chef: Utilize sempre a Velocidade Colher Inversa na Bimby ${model} para não desfiar as fibras da carne durante a cozedura.`
            : `${chosenVariation.chefTip} (Otimizada para Bimby ${model}).`
        };
      };

      const handleSaveRecipe = (recipe) => {
        if (!recipe) return;
        const exists = savedRecipes.some(r => r.title.toLowerCase() === recipe.title.toLowerCase());
        if (exists) {
          showNotification('Esta receita já se encontra guardada no seu Livro!');
          return;
        }
        setSavedRecipes([recipe, ...savedRecipes]);
        showNotification('Receita guardada com sucesso no seu Livro!');
      };

      const requestDeleteSavedRecipe = (id, e) => {
        e.stopPropagation();
        setDeleteModalId(id);
      };

      const confirmDeleteRecipe = () => {
        if (!deleteModalId) return;
        setSavedRecipes(savedRecipes.filter(r => r.id !== deleteModalId));
        if (activeRecipeModal?.id === deleteModalId) {
          setActiveRecipeModal(null);
        }
        setDeleteModalId(null);
        showNotification('Receita removida do Livro.');
      };

      const handleShareRecipe = (recipe) => {
        const textSummary = `🍳 *${recipe.title}* (Bimby ${recipe.model})\n\n` +
          `⏱️ Tempo: ${recipe.prepTime} | 👥 Porções: ${recipe.servings}\n` +
          `📖 Categoria: ${recipe.category.toUpperCase()}\n\n` +
          `🛒 *Ingredientes:* \n${recipe.ingredients.map(i => `• ${i}`).join('\n')}\n\n` +
          `👨‍🍳 *Criado com Chef Bimby AI*`;

        if (navigator.share) {
          navigator.share({ title: recipe.title, text: textSummary, url: window.location.href }).catch(() => {});
        } else {
          try {
            const tempInput = document.createElement('textarea');
            tempInput.value = textSummary;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            setCopiedLink(true);
            showNotification('Resumo copiado para a área de transferência!');
            setTimeout(() => setCopiedLink(false), 2500);
          } catch (e) {
            showNotification('Não foi possível copiar automaticamente.');
          }
        }
      };

      const filteredSavedRecipes = savedRecipes.filter(recipe => {
        const matchesCategory = filterCategory === 'all' || recipe.category === filterCategory;
        const matchesSearch = recipe.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              recipe.ingredients.some(i => i.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans flex flex-col antialiased selection:bg-emerald-500 selection:text-white pb-20">
          
          {/* TOAST NOTIFICAÇÃO NÃO INTRUSIVA */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl border border-emerald-500/40 flex items-center gap-2.5 text-xs font-bold animate-fadeIn">
              <Check className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

          {/* CABEÇALHO */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm px-4 py-3">
            <div className="max-w-5xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-green-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                  <ChefHat className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="font-extrabold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-emerald-700 via-teal-700 to-slate-800 dark:from-emerald-400 dark:to-slate-100 bg-clip-text text-transparent">
                      Chef Bimby AI
                    </h1>
                    <span className="px-2 py-0.5 text-[10px] font-extrabold uppercase bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 rounded-full border border-amber-300 dark:border-amber-800 flex items-center gap-1">
                      <Award className="w-3 h-3 text-amber-600" /> Master 20+
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">
                    O seu Chef Michelin Especialista para Bimby TM31, TM5, TM6 & TM7
                  </p>
                </div>
              </div>

              {/* Seletor Rápido de Modelo */}
              <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700 gap-0.5">
                {['TM31', 'TM5', 'TM6', 'TM7'].map((model) => {
                  const isSelected = selectedBimbyModel === model;
                  return (
                    <button
                      key={model}
                      onClick={() => setSelectedBimbyModel(model)}
                      className={`px-2.5 sm:px-3 py-1.5 text-xs font-bold rounded-lg transition-all flex items-center gap-1 ${
                        isSelected
                          ? model === 'TM7' || model === 'TM6'
                            ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-sm'
                            : 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm border border-slate-200 dark:border-slate-600'
                          : 'text-slate-500 hover:text-slate-900 dark:hover:text-slate-200'
                      }`}
                    >
                      {model === 'TM7' ? (
                        <Sparkles className="w-3.5 h-3.5 text-amber-300" />
                      ) : (
                        <Zap className={`w-3.5 h-3.5 ${isSelected ? 'text-amber-500' : ''}`} />
                      )}
                      {model}
                    </button>
                  );
                })}
              </div>
            </div>
          </header>

          {}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6">
            
            {/* TAB 1: CRIAR RECEITA */}
            {activeTab === 'create' && (
              <div className="space-y-6 animate-fadeIn">
                <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-white p-6 sm:p-8 shadow-xl border border-slate-800">
                  <div className="relative z-10 max-w-2xl space-y-3">
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                      <ChefHat className="w-4 h-4 text-emerald-400" /> Consultoria Culinária Inteligente
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-black tracking-tight leading-tight">
                      O que tem no seu frigorífico hoje?
                    </h2>
                    <p className="text-slate-300 text-sm sm:text-base leading-relaxed">
                      Eu sou a Chef Margarida. Diga-me os ingredientes disponíveis ou introduza uma receita tradicional, e eu crio um passo a passo exato otimizado para a sua <strong className="text-emerald-400">{selectedBimbyModel}</strong>.
                    </p>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 bg-slate-200/80 dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-300/50 dark:border-slate-800">
                  <button
                    onClick={() => setMode('ingredients')}
                    className={`py-3 px-4 rounded-xl font-bold text-sm sm:text-base flex items-center justify-center gap-2 transition-all ${
                      mode === 'ingredients'
                        ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-md'
                        : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'

                <span className="text-[10px]">Criar</span>
              </button>
              <button
                onClick={() => setActiveTab('book')}
                className={`py-2 flex flex-col items-center gap-1 rounded-xl transition-all ${
                  activeTab === 'book' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'
                }`}
              >
                <BookMarked className="w-5 h-5" />
                <span className="text-[10px]">Livro ({savedRecipes.length})</span>
              </button>
              <button
                onClick={() => setActiveTab('settings')}
                className={`py-2 flex flex-col items-center gap-1 rounded-xl transition-all ${
                  activeTab === 'settings' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'
                }`}
              >
                <Settings className="w-5 h-5" />
                <span className="text-[10px]">Definições</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
