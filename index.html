    function parseIngredientsInput(text) {
      if (!text || !text.trim()) {
        return {
          cleanList: [],
          detectedProteins: ['Peito de Frango'],
          primaryProtein: 'Peito de Frango'
        };
      }

      const rawItems = text
        .split(/[,;\n]+/)
        .map(i => i.trim())
        .filter(Boolean);

      const proteinLexicon = [
        'frango', 'peito de frango', 'perna de frango', 'carne picada', 'vaca', 'novilho',
        'porco', 'lombo', 'entrecosto', 'peru', 'coelho', 'pato',
        'salmão', 'bacalhau', 'pescada', 'atum', 'robalo', 'dourada', 'polvo', 'chocos',
        'lulas', 'camarão', 'marisco', 'ameijoas', 'mexilhão',
        'tofu', 'seitan', 'tempeh', 'ovos', 'ovo', 'grão', 'feijão', 'lentilhas'
      ];

      const foundProteins = [];
      const cleanList = [];

      rawItems.forEach(item => {
        const lower = item.toLowerCase();
        const hit = proteinLexicon.find(p => lower.includes(p));
        if (hit) {
          foundProteins.push(item);
        }
        cleanList.push(item);
      });

      const primaryProtein = foundProteins.length > 0 
        ? foundProteins[0] 
        : (cleanList.length > 0 ? cleanList[0] : 'Proteína Nobre');

      return {
        cleanList,
        detectedProteins: foundProteins,
        primaryProtein
      };
    }

    function calculateGourmetQuantities(servingsNum, model) {
      const isTM31 = model === 'TM31';
      // Rácio por pessoa: 140g a 160g de proteína
      let rawProteinGrams = Math.round(servingsNum * 150);
      // Limite do copo Bimby: TM31 máx 500g, outras até 700g para não empapar
      const maxCopoGrams = isTM31 ? 500 : 700;
      const proteinGrams = Math.min(rawProteinGrams, maxCopoGrams);

      // Matriz de Gordura: 30g a 50g para 4 pessoas
      const fatGrams = Math.min(50, Math.max(30, Math.round(25 + servingsNum * 5)));

      // Matriz de Aromáticos: 100g a 150g cebola + 1-3 dentes de alho
      const onionGrams = Math.min(150, Math.max(90, Math.round(servingsNum * 30)));
      const garlicCloves = Math.min(3, Math.max(1, Math.round(servingsNum * 0.6)));

      // Matriz de Líquido: 120g a 200g para estufar
      const braiseLiquidGrams = Math.min(200, Math.max(120, Math.round(100 + servingsNum * 25)));

      return {
        proteinGrams,
        fatGrams,
        onionGrams,
        garlicCloves,
        braiseLiquidGrams,
        isTM31
      };
    }

      const servingsNum = parseInt(servings, 10) || 4;
      const ratios = calculateGourmetQuantities(servingsNum, model);

      const can120 = model === 'TM5' || model === 'TM6' || model === 'TM7';

      // Versão 1: Confeção tradicional no copo (estufado fino / caril emulsionado com Rotação Inversa)

            steps: [

                action: `Coloque no copo ${ratios.onionGrams}g de cebola em quartos, os ${ratios.garlicCloves} dentes de alho e ${ratios.fatGrams}g de azeite. Pique e inicie o refogado base.`,

                temp: refogadoTemp,
                speed: 'Velocidade 5 depois Vel 1',
                rotation: 'Rotação Normal',
                accessory: 'Copo de Medida',

              {

                action: `Adicione ${ratios.proteinGrams}g de ${primaryProtein}. Sele e envolva nos aromáticos com a ROTAÇÃO INVERSA ativa.`,

                speed: colherInversaSpeed,
                rotation: 'Rotação Inversa (Colher Inversa)',

              {
                step: 3,
                action: `Verta exatamente ${ratios.braiseLiquidGrams}g de líquido redutor (vinho/caldo), 150g de tomate, folha de louro e sal. Cozinhe em fervura suave.`,
                min: '18 min',
                temp: '100°C',
                speed: colherInversaSpeed,

              },
              {
                step: 4,

          2. MATRIZ DE PROPORÇÕES E RÁCIOS GASTRONÓMICOS (PADRÃO BIMBY):

             - PROTEÍNA (PORÇÕES E VOLUMES): Dose individual de referência: 120g a 180g de carne/peixe cru por pessoa (450g a 700g para 4 doses). No copo da Bimby: O limite prático para cozinhar pedaços inteiros de carne/peixe com Rotação Inversa sem empapar nem transbordar é de 500g a 700g (TM31: máx. 500g; TM5/TM6/TM7: até 700g).
             - LÍQUIDOS E MOLHOS: Para estufar carne/peixe: 100g a 200g de líquido (vinho, caldo, água, tomate triturado) são suficientes, pois a Bimby condensa e retém o vapor. Nunca sugerir 500ml de líquido para estufar 400g de carne, senão vira sopa. Para cozer massa no copo: Rácio de 100g de massa para 1000g de água; para arroz no cesto: 1000g a 1200g de água para 250g a 350g de arroz.

          3. INOVAÇÃO DO CHEF POR TENTATIVA (TÉCNICA TOTALMENTE DIFERENTE):
             - Tentativa 1 (ou ciclo 1): Confeção tradicional no copo (estufado fino, caril aveludado, molho emulsionado com Rotação Inversa).
             - Tentativa 2 (ou ciclo 2): Cozedura multinível a vapor (Varoma) com molho reduzido em simultâneo no copo.
             - Tentativa 3 (ou ciclo 3): Desconstrução ou puré de base sedoso com a proteína selada ou cozinhada a baixa temperatura.

        `;

            throw new Error("Modo local de contingência ativado");

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${settings.apiKey}`;

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] },
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (!response.ok) throw new Error('Falha na resposta da API');
          const result = await response.json();

                    className="px-6 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BARRA INFERIOR DE NAVEGAÇÃO */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-4 py-2">
            <div className="max-w-md mx-auto grid grid-cols-3 gap-1">
              <button
                onClick={() => setActiveTab('create')}
                className={`py-2 flex flex-col items-center gap-1 rounded-xl transition-all ${
                  activeTab === 'create' ? 'text-emerald-600 dark:text-emerald-400 font-black' : 'text-slate-400'
                }`}
              >
                <ChefHat className="w-5 h-5" />
                <span className="text-[10px]">Criar</span>
              </button>
              <button
                onClick={() => setActiveTab('book')}
                className={`py-2 flex flex-col items-center gap-1 rounded-xl transition-all ${
                  activeTab === 'book' ? 'text-emerald-600 dark:text-emerald-400 font-black' : 'text-slate-400'
                }`}
              >
                <BookMarked className="w-5 h-5" />
                <span className="text-[10px]">Livro ({savedRecipes.length})</span>
              </button>
              <button
                onClick={() => setActiveTab('settings')}
                className={`py-2 flex flex-col items-center gap-1 rounded-xl transition-all ${
                  activeTab === 'settings' ? 'text-emerald-600 dark:text-emerald-400 font-black' : 'text-slate-400'
                }`}
              >
                <Settings className="w-5 h-5" />
                <span className="text-[10px]">Definições</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
