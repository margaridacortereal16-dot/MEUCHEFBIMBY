<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chef Bimby AI - O seu Chef Master 20+</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para transpilação JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
    .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Componentes de Ícones SVG (Lucide Replacements) ---
    const Icon = ({ path, className = "w-5 h-5", ...props }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" {...props}>
        {path}
      </svg>
    );

    const ChefHat = (p) => <Icon {...p} path={<><path d="M6 13.8a4.5 4.5 0 1 1 2.61-8.33A4.5 4.5 0 0 1 16 6a4.5 4.5 0 0 1 2.39 7.8" /><path d="M6 13.8V19a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5.2" /><path d="M6 17h12" /></>} />;
    const Utensils = (p) => <Icon {...p} path={<><path d="M18 2v20" /><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /></>} />;
    const Sparkles = (p) => <Icon {...p} path={<><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /></>} />;
    const BookMarked = (p) => <Icon {...p} path={<><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z" /><path d="M10 2v8l2.5-1.5L15 10V2" /></>} />;
    const Settings = (p) => <Icon {...p} path={<><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" /><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" /></>} />;
    const Share2 = (p) => <Icon {...p} path={<><circle cx="18" cy="5" r="3" /><circle cx="6" cy="12" r="3" /><circle cx="18" cy="19" r="3" /><line x1="8.59" y1="13.51" x2="15.42" y2="17.49" /><line x1="15.41" y1="6.51" x2="8.59" y2="10.49" /></>} />;
    const RotateCcw = (p) => <Icon {...p} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></>} />;
    const Save = (p) => <Icon {...p} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></>} />;
    const Clock = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>} />;
    const Users = (p) => <Icon {...p} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>} />;
    const Flame = (p) => <Icon {...p} path={<><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" /></>} />;
    const Search = (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></>} />;
    const Trash2 = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>} />;
    const Soup = (p) => <Icon {...p} path={<><path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z" /><path d="M7 10V7" /><path d="M12 10V5" /><path d="M17 10V7" /></>} />;
    const Salad = (p) => <Icon {...p} path={<><path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z" /><path d="M12 3v4" /><path d="M8 6l2 2" /><path d="M16 6l-2 2" /></>} />;
    const UtensilsCrossed = (p) => <Icon {...p} path={<><path d="m16 2-4 4 4 4" /><path d="M2 16l4-4 4 4" /><path d="M10 6 2 14" /><path d="m14 10 8 8" /></>} />;
    const Cake = (p) => <Icon {...p} path={<><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8" /><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1" /><path d="M2 21h20" /></>} />;
    const Info = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></>} />;
    const Award = (p) => <Icon {...p} path={<><circle cx="12" cy="8" r="7" /><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" /></>} />;
    const Zap = (p) => <Icon {...p} path={<><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></>} />;
    const Check = (p) => <Icon {...p} path={<><polyline points="20 6 9 17 4 12" /></>} />;
    const Globe = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10" /><line x1="2" y1="12" x2="22" y2="12" /></>} />;

    // Categorias de receitas
    const CATEGORIES = [
      { id: 'sopas', label: 'Sopas', icon: Soup, color: 'from-amber-500 to-orange-600' },
      { id: 'entradas', label: 'Entradas', icon: Salad, color: 'from-emerald-500 to-teal-600' },
      { id: 'pratos', label: 'Pratos Principais', icon: UtensilsCrossed, color: 'from-rose-500 to-red-600' },
      { id: 'sobremesas', label: 'Sobremesas', icon: Cake, color: 'from-purple-500 to-indigo-600' },
    ];

    // Receitas pré-carregadas de demonstração
    const INITIAL_SAVED_RECIPES = [
      {
        id: 'demo-1',
        title: 'Creme de Coentros com Ovo Escalfado',
        category: 'sopas',
        model: 'TM7',
        prepTime: '25 min',
        servings: '4 pessoas',
        difficulty: 'Fácil',
        ingredients: ['500g de batata', '1 xuchu', '1 cebola', '2 dentes de alho', '1 molho de coentros frescos', '50g azeite', '800g água', 'Sal q.b.', '4 ovos'],
        steps: [
          { step: 1, action: 'Coloque a cebola, alho, azeite e metade dos coentros no copo.', min: '5 seg', temp: '-', speed: 'Velocidade 5', notes: 'Pique tudo minuciosamente.' },
          { step: 2, action: 'Refogue os temperos para libertar os aromas.', min: '5 min', temp: '120°C (100°C na TM31)', speed: 'Velocidade 1', notes: 'Na TM31 use temperatura 100°C.' },
          { step: 3, action: 'Adicione as batatas, o xuchu, a água e o sal. Programe a cozedura.', min: '20 min', temp: 'Varoma', speed: 'Velocidade 1', notes: 'Pode colocar os ovos na Varoma para escalfar ao mesmo tempo.' },
          { step: 4, action: 'Junte o restante molho de coentros frescos e triture o creme suavemente.', min: '1 min', temp: '-', speed: 'Velocidade 5-10 progressiva', notes: 'Triture gradualmente para maior segurança térmica.' }
        ],
        chefTip: 'Utilize a borboleta na TM7 se quiser escalfar os ovos diretamente no líquido da sopa no final!'
      },
      {
        id: 'demo-2',
        title: 'Mousse de Chocolate Aveludada Express',
        category: 'sobremesas',
        model: 'TM31',
        prepTime: '15 min (+ 2h frio)',
        servings: '6 pessoas',
        difficulty: 'Fácil',
        ingredients: ['200g chocolate culinário (70%)', '6 ovos M', '100g açúcar', '50g manteiga sem sal', '1 pitada de sal'],
        steps: [
          { step: 1, action: 'Coloque o chocolate em pedaços no copo e pulverize.', min: '10 seg', temp: '-', speed: 'Velocidade 9', notes: 'Garante que derrete uniformemente.' },
          { step: 2, action: 'Junte a manteiga e derreta o chocolate suavemente.', min: '3 min', temp: '50°C', speed: 'Velocidade 2', notes: 'Aqueça suavemente sem queimar.' },
          { step: 3, action: 'Adicione as gemas e o açúcar.', min: '2 min', temp: '50°C', speed: 'Velocidade 3', notes: 'Cria uma emulsão cremosa.' },
          { step: 4, action: 'Insira a borboleta com as claras e a pitada de sal num copo limpo e monte em castelo.', min: '6 min', temp: '-', speed: 'Velocidade 3.5', notes: 'Misture depois delicadamente com a espátula ao creme de chocolate.' }
        ],
        chefTip: 'Sirva com flor de sal e raspas de laranja para um toque digno de restaurante Michelin.'
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('create');
      const [mode, setMode] = useState('ingredients');
      const [ingredientsText, setIngredientsText] = useState('');
      const [recipeToAdaptText, setRecipeToAdaptText] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('pratos');
      const [selectedBimbyModel, setSelectedBimbyModel] = useState('TM7');
      const [cookingTime, setCookingTime] = useState('30');
      const [servingsCount, setServingsCount] = useState('4');

      const [isGenerating, setIsGenerating] = useState(false);
      const [generatedRecipe, setGeneratedRecipe] = useState(null);
      const [generationAttempt, setGenerationAttempt] = useState(1);
      const [copiedLink, setCopiedLink] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');

      const [savedRecipes, setSavedRecipes] = useState(() => {
        const local = localStorage.getItem('bimby_saved_recipes');
        return local ? JSON.parse(local) : INITIAL_SAVED_RECIPES;
      });
      const [filterCategory, setFilterCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [activeRecipeModal, setActiveRecipeModal] = useState(null);

      const [settings, setSettings] = useState(() => {
        const local = localStorage.getItem('bimby_user_settings');
        return local ? JSON.parse(local) : {
          defaultModel: 'TM7',
          apiKey: ''
        };
      });

      useEffect(() => {
        localStorage.setItem('bimby_saved_recipes', JSON.stringify(savedRecipes));
      }, [savedRecipes]);

      useEffect(() => {
        localStorage.setItem('bimby_user_settings', JSON.stringify(settings));
        if (settings.defaultModel) {
          setSelectedBimbyModel(settings.defaultModel);
        }
      }, [settings]);

      const generateRecipeWithAI = async (isRetry = false) => {
        if (mode === 'ingredients' && !ingredientsText.trim()) {
          setErrorMessage('Por favor introduza pelo menos 2 ou 3 ingredientes!');
          return;
        }
        if (mode === 'adapt' && !recipeToAdaptText.trim()) {
          setErrorMessage('Por favor cole o texto da receita que deseja adaptar!');
          return;
        }

        setErrorMessage('');
        setIsGenerating(true);
        const nextAttempt = isRetry ? generationAttempt + 1 : 1;
        if (isRetry) setGenerationAttempt(nextAttempt);

        const systemInstruction = `
          És a Chef Margarida, uma conceituada Chef Executiva Michelin com mais de 20 anos de gastronomia e especialista de topo na cozinha com robôs multifunções Thermomix Bimby (especialmente os modelos Bimby TM31 e Bimby TM7).
          DEVES DEVOLVER EXCLUSIVAMENTE UM OBJETO JSON VÁLIDO com a seguinte estrutura:
          {
            "title": "Nome da Receita Gourmet",
            "category": "${selectedCategory}",
            "model": "${selectedBimbyModel}",
            "prepTime": "Tempo estimado em min",
            "servings": "${servingsCount} pessoas",
            "difficulty": "Fácil | Média | Avançada",
            "ingredients": ["lista de ingredientes com quantidades precisas"],
            "steps": [
              {
                "step": 1,
                "action": "Instrução clara para colocar no copo e preparar",
                "min": "Tempo exato (ex: 5 seg, 10 min, 30 seg)",
                "temp": "Temperatura exata (ex: - , 100°C, Varoma, 120°C)",
                "speed": "Velocidade exata (ex: Vel 1, Vel 4, Vel Colher Inversa, Vel 10)",
                "notes": "Dica prática sobre os acessórios"
              }
            ],
            "chefTip": "Conselho de Chef para um acabamento perfeito."
          }
        `;

        const userPrompt = mode === 'ingredients'
          ? `Cria uma receita de "${selectedCategory}" para Bimby ${selectedBimbyModel} usando: "${ingredientsText}". Tempo limite: ${cookingTime} min. Porções: ${servingsCount}. (Tentativa: ${nextAttempt}).`
          : `Adapta esta receita para Bimby ${selectedBimbyModel}. Categoria: "${selectedCategory}". Texto: "${recipeToAdaptText}".`;

        try {
          if (!settings.apiKey) {
            throw new Error("Modo local de contingência ativo");
          }
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${settings.apiKey}`;
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemInstruction }] },
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          if (!response.ok) throw new Error('Erro na API');
          const result = await response.json();
          const rawJsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;

          if (rawJsonText) {
            const parsedRecipe = JSON.parse(rawJsonText);
            parsedRecipe.id = 'gen-' + Date.now();
            setGeneratedRecipe(parsedRecipe);
          } else {
            throw new Error('Formato inválido');
          }
        } catch (err) {
          const fallbackRecipe = generateFallbackRecipe(mode, ingredientsText, selectedCategory, selectedBimbyModel, nextAttempt);
          setGeneratedRecipe(fallbackRecipe);
        } finally {
          setIsGenerating(false);
        }
      };

      const generateFallbackRecipe = (mode, ingText, cat, model, attempt) => {
        const isTM7 = model === 'TM7';
        const altSuffix = attempt > 1 ? ` (Variação Gourmet #${attempt})` : '';

        if (cat === 'sopas') {
          return {
            id: 'fb-' + Date.now(),
            title: `Creme de Legumes e Ervas do Chef${altSuffix}`,
            category: 'sopas',
            model: model,
            prepTime: '25 min',
            servings: `${servingsCount} pessoas`,
            difficulty: 'Fácil',
            ingredients: ingText ? ingText.split(',').map(i => i.trim()) : ['400g batatas', '1 cenoura', '1 alho-francês', '50g azeite', '700g água', 'Sal e pimenta q.b.'],
            steps: [
              { step: 1, action: 'Coloque no copo a cebola/alho-francês e o azeite.', min: '5 seg', temp: '-', speed: 'Velocidade 5', notes: 'Pique finamente.' },
              { step: 2, action: 'Refogue com a tampa de medição colocada.', min: '5 min', temp: isTM7 ? '120°C' : '100°C', speed: 'Velocidade 1', notes: 'Refogado aromático inicial.' },
              { step: 3, action: 'Adicione os legumes cortados, a água e o sal.', min: '20 min', temp: 'Varoma', speed: 'Velocidade 1', notes: 'Cozedura a vapor suave.' },
              { step: 4, action: 'Triture o creme até ficar totalmente aveludado.', min: '1 min', temp: '-', speed: 'Velocidade 5 a 9 progressiva', notes: 'Aumente a velocidade devagar por segurança.' }
            ],
            chefTip: `Para a Bimby ${model}, adicione um fio de azeite extra virgem no final do triturado para dar um brilho acetinado à sopa!`
          };
        } else if (cat === 'sobremesas') {
          return {
            id: 'fb-' + Date.now(),
            title: `Delícia Cremosa Express${altSuffix}`,
            category: 'sobremesas',
            model: model,
            prepTime: '15 min',
            servings: `${servingsCount} pessoas`,
            difficulty: 'Fácil',
            ingredients: ingText ? ingText.split(',').map(i => i.trim()) : ['200g natas bem frias', '200g leite condensado', '150g fruta ou cacau'],
            steps: [
              { step: 1, action: 'Coloque a borboleta nas lâminas. Adicione as natas bem frias.', min: '2 min', temp: '-', speed: 'Velocidade 3.5', notes: 'Vigilância visual para não virar manteiga.' },
              { step: 2, action: 'Envolva o leite condensado e o sabor escolhido.', min: '30 seg', temp: '-', speed: 'Velocidade 2', notes: 'Mistura delicada com a espátula no final.' }
            ],
            chefTip: 'Leve ao frigorífico por 3 horas antes de servir decorado com folhinhas de hortelã fresca.'
          };
        } else {
          return {
            id: 'fb-' + Date.now(),
            title: `Estufado Rápido de Assinatura${altSuffix}`,
            category: cat,
            model: model,
            prepTime: '30 min',
            servings: `${servingsCount} pessoas`,
            difficulty: 'Média',
            ingredients: ingText ? ingText.split(',').map(i => i.trim()) : ['500g proteína/legumes', '1 cebola', '2 alhos', '50g azeite', '100g vinho branco', 'Polpa de tomate e sal q.b.'],
            steps: [
              { step: 1, action: 'Pique a cebola, alho e azeite no copo.', min: '5 seg', temp: '-', speed: 'Velocidade 5', notes: 'Base de refogado.' },
              { step: 2, action: 'Refogue sem o copo de medida para evaporar.', min: '5 min', temp: isTM7 ? '120°C' : '100°C', speed: 'Velocidade 1', notes: 'Utilize o cesto sobre a tampa se espirrar.' },
              { step: 3, action: 'Adicione os restantes ingredientes e temperos.', min: '20 min', temp: '100°C', speed: isTM7 ? 'Colher Inversa' : 'Velocidade Colher / Rotação Inversa', notes: isTM7 ? 'Ative o modo Colher com rotação inversa.' : 'Pressione o botão de Inversão de Lâminas na TM31.' }
            ],
            chefTip: 'O segredo de um grande Chef na Bimby é utilizar sempre ingredientes à temperatura ambiente antes de começar!'
          };
        }
      };

      const handleSaveRecipe = (recipe) => {
        if (!recipe) return;
        const exists = savedRecipes.some(r => r.title === recipe.title);
        if (exists) {
          alert('Esta receita já se encontra guardada no seu Livro de Receitas!');
          return;
        }
        setSavedRecipes([recipe, ...savedRecipes]);
        alert('Receita guardada com sucesso no seu Livro!');
      };

      const handleDeleteSavedRecipe = (id, e) => {
        e.stopPropagation();
        if (window.confirm('Tem a certeza que deseja eliminar esta receita das guardadas?')) {
          setSavedRecipes(savedRecipes.filter(r => r.id !== id));
          if (activeRecipeModal?.id === id) {
            setActiveRecipeModal(null);
          }
        }
      };

      const handleShareRecipe = (recipe) => {
        const textSummary = `🍳 *${recipe.title}* (Bimby ${recipe.model})\n\n` +
          `⏱️ Tempo: ${recipe.prepTime} | 👥 Porções: ${recipe.servings}\n` +
          `📖 Categoria: ${recipe.category.toUpperCase()}\n\n` +
          `🛒 *Ingredientes:* \n${recipe.ingredients.map(i => `• ${i}`).join('\n')}\n\n` +
          `👨‍🍳 *Criado com Chef Bimby AI*`;

        if (navigator.share) {
          navigator.share({ title: recipe.title, text: textSummary, url: window.location.href }).catch(() => {});
        } else {
          navigator.clipboard.writeText(textSummary);
          setCopiedLink(true);
          setTimeout(() => setCopiedLink(false), 2500);
        }
      };

      const filteredSavedRecipes = savedRecipes.filter(recipe => {
        const matchesCategory = filterCategory === 'all' || recipe.category === filterCategory;
        const matchesSearch = recipe.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              recipe.ingredients.some(i => i.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans flex flex-col antialiased selection:bg-emerald-500 selection:text-white pb-20">
          
          {/* CABEÇALHO */}
          <header className="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm px-4 py-3">
            <div className="max-w-5xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 via-teal-500 to-green-400 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                  <ChefHat className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <h1 className="font-extrabold text-lg sm:text-xl tracking-tight bg-gradient-to-r from-emerald-700 via-teal-700 to-slate-800 dark:from-emerald-400 dark:to-slate-100 bg-clip-text text-transparent">
                      Chef Bimby AI
                    </h1>
                    <span className="px-2 py-0.5 text-[10px] font-extrabold uppercase bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 rounded-full border border-amber-300 dark:border-amber-800 flex items-center gap-1">
                      <Award className="w-3 h-3 text-amber-600" /> Master 20+
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">
                    O seu Chef Michelin Especialista para Bimby TM31 & TM7
                  </p>
                </div>
              </div>

              {/* Seletor Rápido de Modelo */}
              <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
                <button
                  onClick={() => setSelectedBimbyModel('TM31')}
                  className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all flex items-center gap-1 ${
                    selectedBimbyModel === 'TM31'
                      ? 'bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm border border-slate-200 dark:border-slate-600'

                  <button
                    onClick={() => setActiveRecipeModal(null)}
                    className="px-6 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs"
                  >
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BARRA DE NAVEGAÇÃO INFERIOR */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 px-4 py-2">
            <div className="max-w-md mx-auto grid grid-cols-3 gap-1">
              <button
                onClick={() => setActiveTab('create')}
                className={`py-2 flex flex-col items-center gap-1 rounded-xl transition-all ${
                  activeTab === 'create' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'
                }`}
              >
                <ChefHat className="w-5 h-5" />
                <span className="text-[10px]">Criar</span>
              </button>
              <button
                onClick={() => setActiveTab('book')}
                className={`py-2 flex flex-col items-center gap-1 rounded-xl transition-all ${
                  activeTab === 'book' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'
                }`}
              >
                <BookMarked className="w-5 h-5" />
                <span className="text-[10px]">Livro ({savedRecipes.length})</span>
              </button>
              <button
                onClick={() => setActiveTab('settings')}
                className={`py-2 flex flex-col items-center gap-1 rounded-xl transition-all ${
                  activeTab === 'settings' ? 'text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-400'
                }`}
              >
                <Settings className="w-5 h-5" />
                <span className="text-[10px]">Definições</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
